name: Generate Awesome README

on:
  push:
    branches:
      - main
    paths:
      - "content/**"
      - "scripts/generate_readme.py"
      - "LICENSE"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate README.md
        run: python3 scripts/generate_readme.py

      - name: Stage list branch contents
        run: |
          mkdir -p _list_dist
          cp README.md _list_dist/README.md
          cp LICENSE _list_dist/LICENSE

      - name: Publish to list branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_list_dist
          publish_branch: list
          force_orphan: true
          commit_message: "chore: regenerate Awesome Vibe Coding README"
